create_chore:
  name: Create chore
  description: Create a new chore on the Skylight calendar
  fields:
    summary:
      name: Summary
      description: The chore summary/title
      required: true
      selector:
        text:
    emoji_icon:
      name: Emoji icon
      description: Optional emoji icon
      required: false
      selector:
        text:
    category_id:
      name: Category ID
      description: Optional category/family member ID
      required: false
      selector:
        text:

announce_chores:
  name: Announce chores for person
  description: Fetch pending Skylight chores for a family member and broadcast them over a speaker using TTS
  fields:
    person:
      name: Person
      description: Name of the family member on the Skylight chore chart (Hannah, Jakeb, Drew, Natalie, Carrie, Pheve, Willow)
      required: true
      example: "Hannah"
      selector:
        select:
          options:
            - "Hannah"
            - "Jakeb"
            - "Drew"
            - "Natalie"
            - "Carrie"
            - "Pheve"
            - "Willow"
          custom_value: true
    message_prefix:
      name: Announcement Intro Text
      description: Custom intro phrase spoken before reading out each chore
      required: false
      example: "Attention Hannah, this is your list of chores for the day"
      selector:
        text:
    target_date:
      name: Target Date (Optional)
      description: Specific YYYY-MM-DD date to filter chores for (leave blank to include all currently pending chores up to today)
      required: false
      selector:
        date:
    skip_if_empty:
      name: Skip Announcement If No Chores
      description: If enabled, nothing will be spoken when the person has zero pending chores
      required: false
      default: false
      selector:
        boolean:
    volume_level:
      name: Volume Level
      description: Speaker volume (0.0 to 1.0, e.g. 0.5 for 50%)
      required: false
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    media_player_entity_id:
      name: Media Player
      description: Speaker to announce over
      required: false
      default: "media_player.living_room_display"
      selector:
        entity:
          domain: media_player
    tts_entity_id:
      name: TTS Engine
      description: Text-to-speech engine entity
      required: false
      default: "tts.google_translate_en_com"
      selector:
        entity:
          domain: tts
