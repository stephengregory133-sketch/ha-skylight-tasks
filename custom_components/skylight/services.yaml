create_chore:
  name: Create chore
  description: Create a new chore on the Skylight calendar
  fields:
    summary:
      name: Summary
      description: The chore summary/title
      required: true
      selector:
        text:
    emoji_icon:
      name: Emoji icon
      description: Optional emoji icon
      required: false
      selector:
        text:
    category_id:
      name: Category ID
      description: Optional category/family member ID
      required: false
      selector:
        text:

announce_chores:
  name: Announce chores for person
  description: Fetch pending Skylight chores for a family member and broadcast them over a speaker using TTS
  fields:
    person:
      name: Person
      description: Name of the family member on the Skylight chore chart (e.g. Hannah, Jakeb, Drew, Natalie, Carrie, Pheve, Willow)
      required: true
      example: "Hannah"
      selector:
        text:
    media_player_entity_id:
      name: Media Player
      description: Speaker to announce over
      required: false
      default: "media_player.living_room_display"
      selector:
        entity:
          domain: media_player
    tts_entity_id:
      name: TTS Engine
      description: Text-to-speech engine entity
      required: false
      default: "tts.google_translate_en_com"
      selector:
        entity:
          domain: tts
    volume_level:
      name: Volume Level
      description: Speaker volume (0.0 to 1.0)
      required: false
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
